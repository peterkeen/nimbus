---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: external-dns-management
spec:
  interval: 5m
  url: https://github.com/gardener/external-dns-management
  ref:
    tag: v0.27.0
  ignore: |
    # exclude all
    /*
    # include charts directory
    !/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-management
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns-management
      version: '0.1.0'
      sourceRef:
        kind: GitRepository
        name: external-dns-management
      interval: 5m

