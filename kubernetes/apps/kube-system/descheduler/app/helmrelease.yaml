---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
spec:
  interval: 5m
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-management
spec:
  interval: 5m
  chart:
    spec:
      chart: descheduler
      version: '0.33.0'
      sourceRef:
        kind: HelmRepository
        name: descheduler
      interval: 5m
