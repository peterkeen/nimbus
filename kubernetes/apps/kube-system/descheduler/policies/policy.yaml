---
apiVersion: "descheduler/v1alpha2"
kind: "DeschedulerPolicy"
metadata:
  name: descheduler-policies
profiles:
  - name: LowNodeUtilization
    pluginConfig:
      - name: "LowNodeUtilization"
        args:
          thresholds:
            "memory": 20
          targetThresholds:
            "memory": 70
    plugins:
      balance:
        enabled:
          - "LowNodeUtilization"
  - name: RemoveFailedPods
    pluginConfig:
      - name: "RemoveFailedPods"
        args:
          includingInitContainers: true
          minPodLifetimeSeconds: 3600
    plugins:
      deschedule:
        enabled:
          - "RemoveFailedPods"
  - name: RemoveDuplicates
    pluginConfig:
      - name: "RemoveDuplicates"
    plugins:
      balance:
        enabled:
          - "RemoveDuplicates"
