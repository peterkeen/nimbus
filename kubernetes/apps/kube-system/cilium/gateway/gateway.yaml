---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTP
      port: 80
      name: private-gw
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway: private-gw
    - protocol: HTTPS
      port: 443
      name: wildcard-https-private-gw
      hostname: "*.keen.land"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway: private-gw
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-prod
            namespace: cert-manager
