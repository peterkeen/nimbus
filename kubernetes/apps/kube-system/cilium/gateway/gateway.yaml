---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTP
      name: http
      hostname: "*.keen.land"
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      name: https
      hostname: "*.keen.land"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            group: ""
            name: keenland-wildcard-cert
            namespace: cert-manager
