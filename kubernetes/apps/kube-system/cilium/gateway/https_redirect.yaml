---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: private-gw-redirect-http-to-https
spec:
  parentRefs:
    - name: private-gateway
      sectionName: http
  hostnames:
    - "*"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
