---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - port: 25565
      targetPort: 25565
      name: java
    - port: 19132
      targetPort: 19132
      name: bedrock
    - port: 19132
      targetPort: 19132
      protocol: UDP
      name: bedrock-udp
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-bluemap
spec:
  selector:
    app: minecraft
  ports:
    - protocol: TCP
      port: 8100
