---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ersatztv
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - ersatztv.nimbus.keen.land
    - ersatztv.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: ersatztv
          port: 8409
