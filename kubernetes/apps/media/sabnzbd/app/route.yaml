---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - sabnzbd.nimbus.keen.land
    - sabnzbd.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: sabnzbd
          port: 8080
