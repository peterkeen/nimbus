---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      volumes:
        - name: media-nfs
          persistentVolumeClaim:
            claimName: media-nfs
        - name: sonarr-configs
          persistentVolumeClaim:
            claimName: sonarr-configs-pvc
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          imagePullPolicy: "Always"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: media-nfs
              mountPath: /media
            - name: sonarr-configs
              mountPath: /config
