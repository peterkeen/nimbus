---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - sonarr.nimbus.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: sonarr
          port: 7878
