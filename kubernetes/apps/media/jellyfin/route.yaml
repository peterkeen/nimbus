---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  parentRefs:
    - name: private-gw
      namespace: kube-system
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: jellyfin
          namespace: media
          port: 8096
