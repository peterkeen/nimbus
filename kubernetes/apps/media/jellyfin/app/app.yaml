---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
  annotations:
    keel.sh/policy: "major"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
    keel.sh/approvals: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeName: nibbler
      volumes:
        # - name: media-nfs
        #   nfs:
        #     server: 10.73.95.84
        #     path: /mnt/tank/media
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
            # - name: jellyfin-cache
            #   nfs:
            #     server: 10.73.95.84
            #     path: /mnt/tank/media/jellyfin/cache
            # - name: jellyfin-transcodes
            #   hostPath:
            #     path: /var/mnt/data/jellyfin-transcodes
            #     type: DirectoryOrCreate
            # - name: dev
            #   hostPath:
            #     path: /dev
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:10.10.7
          imagePullPolicy: "Always"
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            # - name: media-nfs
            #   mountPath: /mnt/media
            - name: jellyfin-config
              mountPath: /config
            # - name: jellyfin-cache
            #   mountPath: /cache
            # - name: jellyfin-transcodes
            #   mountPath: /transcodes
            # - name: dev
            #   mountPath: /dev
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "4Gi"
        - name: jellyfin-clean-cache
          image: alpine:3.22
          volumeMounts:
            - name: jellyfin-transcodes
              mountPath: /transcodes
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "128Mi"
          command:
            - /bin/ash
            - -c
            - |
              while true; do
                find /transcodes -mmin +119 -type f -exec rm -fv {} \;
                sleep 60
              done
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
