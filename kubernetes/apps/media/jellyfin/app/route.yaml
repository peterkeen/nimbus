---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  parentRefs:
    - name: private-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - jellyfin-test.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
