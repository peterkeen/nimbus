---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - jellyfin.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
