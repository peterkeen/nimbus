---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - calibre.nimbus.keen.land
    - calibre.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: calibre
          port: 8083
