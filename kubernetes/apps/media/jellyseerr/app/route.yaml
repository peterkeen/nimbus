---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseerr
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - jellyseerr.nimbus.keen.land
    - jellyseerr.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: jellyseerr
          port: 8989
