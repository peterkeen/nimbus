---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - bazarr.nimbus.keen.land
    - bazarr.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: bazarr
          port: 6767
