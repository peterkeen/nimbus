---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
spec:
  interval: 5m
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudnative-pg
      version: '1.9.1'
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 5m
