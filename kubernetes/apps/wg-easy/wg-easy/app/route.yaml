---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wg-easy
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - wg.nimbus.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: wg-easy
          port: 51821
