---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
spec:
  interval: 5m
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: '37.1.1'
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 5m
  values:
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesGateway:
        enabled: true
    deployment:
      replicas: 2
    extraObjects:
      - apiVersion: onepassword.com/v1
        kind: OnePasswordItem
        metadata:
          name: fly-ingress-wireguard-configs
          namespace: public
        spec:
          itemPath: "vaults/fmycvdzmeyvbndk7s7pjyrebtq/items/l2g3j66dfjrauwpwx5cb2uhggu"
    additionalVolumes:
      - name: wireguard-config
        secret:
          secretName: fly-ingress-wireguard-configs
    additionalContainers:
      - name: fly-wireguard
        image: lscr.io/linuxserver/wireguard:latest
        volumeMounts:
          - name: wireguard-config
            mountPath: /config/wg_confs
        securityContext:
          privileged: true
          capabilities:
            add:
              - "NET_ADMIN"
              - "SYS_MODULE"
