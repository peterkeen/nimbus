---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zwave
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - "genmon.nimbus.keen.land"
    - "genmon.keen.land"
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: genmon
          port: 8000

