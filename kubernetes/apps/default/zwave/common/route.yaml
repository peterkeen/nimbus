---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zwave
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - zwave.nimbus.keen.land
    - zwave.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: zwave
          port: 8989
