---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwave
  labels:
    app: zwave
  annotations:
    keel.sh/policy: "major"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
    keel.sh/approvals: "0"
    operator.1password.io/auto-restart: "true"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "${selector}"
  template:
    metadata:
      labels:
        app: zwave
    spec:
      volumes:
        - name: zwave
          persistentVolumeClaim:
            claimName: zwave-pvc
      containers:
        - name: zwave
          image: ghcr.io/zwave-js/zwave-js-ui:11.1.0
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: zwave
              mountPath: /usr/src/app/store
          resources:
            requests:
              memory: '256Mi'
            limits:
              memory: '256Mi'
