---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zwave-office
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app: *app
  interval: 1h
  path: ./kubernetes/apps/default/zwave/common
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  nameSuffix: -office
  postBuild:
    substitute:
      hostname: "zwave-office"
      selector: "zwave-office"
