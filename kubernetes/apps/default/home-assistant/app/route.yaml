---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - hass.nimbus.keen.land
    - hass.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
