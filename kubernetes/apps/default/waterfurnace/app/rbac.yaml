---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: waterfurnace-restart
---
# allow getting status and patching only the one deployment you want
# to restart
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: waterfurnace-restart
rules:
  - apiGroups:
      - "apps"
      - "extensions"
    resources:
      - "deployments"
    resourceNames:
      - "waterfurnace"
    verbs:
      - "get"
      - "patch"
      - "list"
      - "watch"
    # if you want to use `rollout status`
---
# "list" and "watch" are only needed
# bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: waterfurnace-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: waterfurnace-restart
subjects:
  - kind: ServiceAccount
    name: waterfurnace-restart
    namespace: default
