---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee
  labels:
    app: zigbee
  annotations:
    keel.sh/policy: "major"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
    keel.sh/approvals: "0"
    operator.1password.io/auto-restart: "true"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "${selector}"
  template:
    metadata:
      labels:
        app: "${selector}"
    spec:
      volumes:
        - name: zigbee
          persistentVolumeClaim:
            claimName: zigbee-pvc
      containers:
        - name: zigbee
          image: ghcr.io/koenkk/zigbee2mqtt:2.6.0
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: zigbee
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "128Mi"
