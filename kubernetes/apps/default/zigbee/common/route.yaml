---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - "${hostname}.nimbus.keen.land"
    - "${hostname}.keen.land"
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: "${selector}"
          port: 8091
    - matches:
        - path:
            value: /ws
      backendRefs:
        - name: "${selector}"
          port: 3000
