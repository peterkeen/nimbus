---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vls
spec:
  parentRefs:
    - name: private-traefik
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - logs.nimbus.keen.land
  rules:
    - matches:
        - path:
            value: /
      backendRefs:
        - name: vls-victoria-logs-single-server
          port: 9428
