---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vm
spec:
  interval: 5m
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vls
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-logs-single
      version: '0.11.8'
      sourceRef:
        kind: HelmRepository
        name: vm
      interval: 5m
  values:
    mode: deployment
    global:
      cluster:
        dnsDomain: nimbus.keen.land.

    server:
      persistentVolume:
        enabled: true
        storageClassName: longhorn
      ingress:
        enabled: false
    vector:
      enabled: true
